spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
    show-sql: true

oauth2:
  client:
    github:
      id: 'id'
      secret: 'secret'
  client-dev:
    github:
      id: 'id'
      secret: 'dev'

jwt:
  secret: 'jwt_secret_key_with_size_greater_than_256_bits'
